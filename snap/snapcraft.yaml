title: esptool
license: MIT
source-code:
  - https://github.com/espressif/esptool
issues:
  - https://github.com/durrendal/esptool-snap
website:
  - https://docs.espressif.com/projects/esptool/
contact:
  - durrendal@lambdacreate.com
name: espressif-esptool
base: core24
version: v5.2.0
summary: Serial utility for flashing, provisioning, and interacting with Espressif SoCs
description: |
  A Python-based, open-source, platform-independent serial utility for flashing, 
  provisioning, and interacting with Espressif SoCs (ESP32, ESP8266, etc.).
  
  Features:
  - Flash firmware to ESP32, ESP8266, and other Espressif chips
  - Read, write, erase, and verify binary data stored in flash
  - Read chip features and MAC address information
  - Read and write one-time-programmable eFuses
  - Support for various firmware formats and bootloaders
  - Complete toolset including esptool, espefuse, and espsecure
  - Work with ROM bootloader and flasher stub
  
  This tool is essential for ESP32/ESP8266 development, IoT projects, and 
  MicroPython firmware installation.

grade: stable
confinement: strict

parts:
  esptool:
    plugin: python
    source: https://github.com/espressif/esptool.git
    source-type: git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - python3-dev
      - libffi-dev
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - build-essential
      - git
    stage-packages:
      - python3-minimal
    override-build: |
      craftctl default
      # Ensure all binaries are executable
      for binary in esptool espefuse espsecure; do
        if [ -f $CRAFT_PART_INSTALL/bin/$binary ]; then
          chmod +x $CRAFT_PART_INSTALL/bin/$binary
        fi
      done


apps:
  esptool:
    command: bin/esptool
    environment:
      PATH: $SNAP/bin:$PATH
    plugs:
      - home
      - removable-media
      - raw-usb
      - serial-port
      - network

  espefuse:
    command: bin/espefuse
    environment:
      PATH: $SNAP/bin:$PATH
    plugs:
      - home
      - removable-media
      - raw-usb
      - serial-port

  espsecure:
    command: bin/espsecure
    environment:
      PATH: $SNAP/bin:$PATH
    plugs:
      - home
      - removable-media
